[package]
name = "quantum-coherence-test"
version = "1.0.0"
edition = "2021"
description = "Quantum coherence testing framework with Python pipes and quantum library integration"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["quantum", "coherence", "superposition", "python", "testing"]
categories = ["science", "simulation", "testing"]

[lib]
name = "quantum_coherence"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "coherence-test"
path = "src/bin/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = ["quantum", "parallel"]
full = ["quantum", "python", "plotting", "parallel"]
quantum = []
python = ["pyo3"]
plotting = []
parallel = ["rayon", "crossbeam"]
ml = []
simd = []

[dependencies]
# Numerical computing
nalgebra = { version = "0.32", features = ["sparse", "serde-serialize"] }
ndarray = { version = "0.15", features = ["serde", "rayon"] }
num-complex = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_distr = "0.4"

# Parallel processing
rayon = { version = "1.7", optional = true }
crossbeam = { version = "0.8", optional = true }

# Python integration
pyo3 = { version = "0.19", features = ["extension-module", "macros"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
clap = { version = "4.0", features = ["derive"] }
config = "0.13"
toml = "0.7"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.4"
proptest = "1.1"
quickcheck = "1.0"
pretty_assertions = "1.3"
test-case = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1
assert_cmd = "2.1"
predicates = "3.1"

