[package]
name = "quantum-coherence-test"
version = "0.1.0"
edition = "2021"
authors = ["Maintainer <maintainer@example.com>"]
description = "Minimal quantum coherence crate for tests"
license = "MIT"

[lib]
name = "quantum_coherence"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "coherence-test"
path = "src/bin/main.rs"

[dependencies]
# Linear algebra library for quantum computations
nalgebra = "0.33"

# Complex number support for quantum states
num-complex = "0.4"

# Error handling
anyhow = "1.0"

# Environment variable loading
dotenvy = "0.15"

# Serialization (for results export)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional Python bindings via pyo3. Enable with `--features python` when building.
[dependencies.pyo3]
version = "0.21"
optional = true
features = ["extension-module"]

[features]
python = ["pyo3"]
default = []

[dev-dependencies]
pretty_assertions = "1.4"
assert_cmd = "2.1"
predicates = "3.1"

