name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Read secrets from repository settings (GitHub Secrets)
      SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-
      - name: Build (debug)
        run: cargo build --verbose
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
      - name: Run Python tests
        run: |
          if [ -d python/tests ]; then pytest -q python/tests; fi
      - name: Run tests
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release --verbose

  build-python-extension:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin and build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel maturin
      - name: Build and install Python extension
        run: |
          # Build and install the Python extension (feature-gated pyo3 binding)
          python -m pip install --upgrade pip setuptools wheel maturin
          maturin develop --release --features python
      - name: Run Python extension tests
        run: |
          pytest -q python/tests -k "not test_coherence_script"